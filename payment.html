<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill Generation and Payment</title>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f4f4f4;
}
.container {
    max-width: 600px;
    margin: 20px auto;
    background-color: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}
input[type="text"],
input[type="number"],
button {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 5px;
}
button {
    background-color: #007bff;
    color: #fff;
    cursor: pointer;
}
button:hover {
    background-color: #0056b3;
}
</style>
</head>
<body>

<div class="container">
    <h2>Bill Generation and Payment</h2>
    <label for="itemName">Item Name:</label>
    <input type="text" id="itemName">
    <label for="itemPrice">Item Price:</label>
    <input type="number" id="itemPrice" min="0">
    <button onclick="generateBill()">Generate Bill</button>

    <div id="billContainer" style="display: none;">
        <h3>Bill Details</h3>
        <p id="itemNameDisplay"></p>
        <p id="itemPriceDisplay"></p>
        <p id="totalAmountDisplay"></p>
        <button onclick="processPayment()">Pay Now</button>
    </div>
</div>

<script>
function generateBill() {
    var itemName = document.getElementById("itemName").value;
    var itemPrice = parseFloat(document.getElementById("itemPrice").value);
    var billContainer = document.getElementById("billContainer");

    if (itemName && itemPrice) {
        document.getElementById("itemNameDisplay").innerText = "Item Name: " + itemName;
        document.getElementById("itemPriceDisplay").innerText = "Item Price: Rs" + itemPrice.toFixed(2);
        document.getElementById("totalAmountDisplay").innerText = "Total Amount: RS" + itemPrice.toFixed(2);
        billContainer.style.display = "block";
    } else {
        alert("Please enter item name and price.");
    }
}

function processPayment() {
    var totalAmount = parseFloat(document.getElementById("itemPrice").value);
    // Here you can implement payment processing logic (e.g., redirecting to a payment gateway)
    alert("Payment processed successfully for RS" + totalAmount.toFixed(2));
}
</script>

</body>
</html>
